name: Build PS4 PKG

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run JavaScript tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            .deps/embeddedReact
            .deps/quickjs
            .deps/harfbuzz-src
            .build/harfbuzz
          key: ps4-react-deps-v3-${{ hashFiles('dependencies.lock.json', 'tools/build_ci.sh', 'tools/build_samples.sh') }}

      - name: Install PacBrew toolchain and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pacman-package-manager libarchive-tools cmake make git curl xz-utils python3
          sudo ln -sf /proc/mounts /etc/mtab
          sudo tee -a /etc/pacman.conf >/dev/null <<'EOF'

          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          EOF
          sudo pacman -Sy --noconfirm
          sudo pacman -S --noconfirm ps4-openorbis pacbrew-ps4-portlibs

      - name: Build PS4-React-Starter.pkg
        run: bash tools/build_ci.sh

      - name: Build sample PKGs
        run: PS4_REACT_REUSE_BUILD=1 bash tools/build_samples.sh

      - name: Collect artifacts
        run: |
          mkdir -p build/release
          cp build/PS4-React-Starter.pkg build/release/
          cp samples-pkg/*.pkg build/release/
          cd build/release
          sha256sum *.pkg > SHA256SUMS
          cat SHA256SUMS

      - name: Upload PKGs
        uses: actions/upload-artifact@v4
        with:
          name: PS4-React-PKGs
          path: build/release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download PKGs
        uses: actions/download-artifact@v4
        with:
          name: PS4-React-PKGs
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.pkg release/SHA256SUMS \
            --title "PS4 React $GITHUB_REF_NAME" --generate-notes
